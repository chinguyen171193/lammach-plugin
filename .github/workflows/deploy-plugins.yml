name: Deploy WordPress plugins

on:
  push:
    branches:
      - main
    paths:
      - 'lm-pcb-image-tracer/**'
      - 'cty-1-nguoi/**'
      - 'lm-ai-digital-office/**'
  workflow_dispatch:
    inputs:
      plugin:
        description: Chọn plugin cần deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - lm-pcb-image-tracer
          - cty-1-nguoi
          - lm-ai-digital-office

permissions:
  contents: read

jobs:
  changes:
    name: Kiểm tra plugin thay đổi
    runs-on: ubuntu-latest
    outputs:
      pcb: ${{ steps.filter.outputs.pcb }}
      cty: ${{ steps.filter.outputs.cty }}
      ai_office: ${{ steps.filter.outputs.ai_office }}
    steps:
      - name: Lấy source code
        uses: actions/checkout@v6

      - name: Xác định thư mục đã thay đổi
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            pcb:
              - 'lm-pcb-image-tracer/**'
            cty:
              - 'cty-1-nguoi/**'
            ai_office:
              - 'lm-ai-digital-office/**'

  deploy-pcb:
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.plugin == 'all' || inputs.plugin == 'lm-pcb-image-tracer')) || (github.event_name == 'push' && needs.changes.outputs.pcb == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy source code
        uses: actions/checkout@v6

      - name: Upload LM PCB Image Tracer
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./lm-pcb-image-tracer/
          server-dir: /public_html/wp-content/plugins/lm-pcb-image-tracer/
          dangerous-clean-slate: false

  deploy-cty:
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.plugin == 'all' || inputs.plugin == 'cty-1-nguoi')) || (github.event_name == 'push' && needs.changes.outputs.cty == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy source code
        uses: actions/checkout@v6

      - name: Upload CTY 1 Người
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./cty-1-nguoi/
          server-dir: /public_html/wp-content/plugins/cty-1-nguoi/
          dangerous-clean-slate: false

  deploy-ai-office:
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.plugin == 'all' || inputs.plugin == 'lm-ai-digital-office')) || (github.event_name == 'push' && needs.changes.outputs.ai_office == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy source code
        uses: actions/checkout@v6

      - name: Upload LM AI Digital Office
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 900000
          local-dir: ./lm-ai-digital-office/
          server-dir: /public_html/wp-content/plugins/lm-ai-digital-office/
          dangerous-clean-slate: false
